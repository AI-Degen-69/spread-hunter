name: Sync Labels

on:
  push:
    paths:
      - '.github/labels.yaml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync labels from .github/labels.yaml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          yq -o=json '.[]' .github/labels.yaml | jq -c '.' | while IFS= read -r item; do
            name=$(echo "$item" | jq -r '.name')
            color=$(echo "$item" | jq -r '.color')
            desc=$(echo "$item" | jq -r '.description // ""')
            # Try to create; if it already exists (422), that's fine - just skip
            # We don't check first; we just try and ignore 422
            output=$(gh api --method POST repos/$GH_REPO/labels \
              -f name="$name" \
              -f color="$color" \
              -f description="$desc" 2>&1) || true
            if echo "$output" | grep -q '"code":"already_exists"'; then
              echo "Label '$name' exists, skipping"
            elif echo "$output" | grep -q '"message":"Validation Failed"'; then
              # Some other validation error - report and fail
              echo "ERROR creating label '$name': $output" >&2
              exit 1
            else
              echo "Created label '$name' (#$color)"
            fi
          done