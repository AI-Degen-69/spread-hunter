name: Sync Labels

on:
  push:
    paths:
      - '.github/labels.yaml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync labels from .github/labels.yaml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          yq -o=json '.[]' .github/labels.yaml | jq -c '.' | while IFS= read -r item; do
            name=$(echo "$item" | jq -r '.name')
            color=$(echo "$item" | jq -r '.color')
            desc=$(echo "$item" | jq -r '.description // ""')
            # Try to create; if it already exists (422), that's fine - skip it
            if gh api --method POST repos/$GH_REPO/labels \
              -f name="$name" \
              -f color="$color" \
              -f description="$desc" 2>/dev/null; then
              echo "Created label '$name' (#$color)"
            else
              # Check if it was a 422 (already exists) vs real error
              if gh api repos/$GH_REPO/labels --jq '.[].name' | grep -Fxq "$name" 2>/dev/null; then
                echo "Label '$name' exists, skipping"
              else
                echo "ERROR: Failed to create label '$name'" >&2
                exit 1
              fi
            fi
          done