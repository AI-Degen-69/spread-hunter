name: Sync Labels

on:
  push:
    paths:
      - '.github/labels.yaml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync labels from .github/labels.yaml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Fetch existing labels once, store as JSON array of names
          existing=$(gh api repos/$GH_REPO/labels --jq 'map(.name)')
          # Process each label from YAML
          yq -o=json '.[]' .github/labels.yaml | jq -c '.' | while IFS= read -r item; do
            name=$(echo "$item" | jq -r '.name')
            color=$(echo "$item" | jq -r '.color')
            desc=$(echo "$item" | jq -r '.description // ""')
            # Check if label exists using jq (handles Unicode properly)
            if echo "$existing" | jq -e --arg n "$name" 'index($n)' >/dev/null; then
              echo "Label '$name' exists, skipping"
              continue
            fi
            echo "Creating label '$name' (#$color)"
            gh api --method POST repos/$GH_REPO/labels \
              -f name="$name" \
              -f color="$color" \
              -f description="$desc"
          done