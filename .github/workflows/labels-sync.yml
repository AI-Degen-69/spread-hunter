name: Sync Labels

on:
  push:
    paths:
      - '.github/labels.yaml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync labels from .github/labels.yaml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Use yq to output JSON, then process with jq
          yq -o=json '.[]' .github/labels.yaml | jq -c '.' | while IFS= read -r item; do
            name=$(echo "$item" | jq -r '.name')
            color=$(echo "$item" | jq -r '.color')
            desc=$(echo "$item" | jq -r '.description // ""')
            # Skip if label already exists
            if gh api repos/$GH_REPO/labels --jq '.[].name' | grep -Fxq "$name"; then
              echo "Label '$name' exists, skipping"
              continue
            fi
            echo "Creating label '$name' (#$color)"
            gh api --method POST repos/$GH_REPO/labels \
              -f name="$name" \
              -f color="$color" \
              -f description="$desc"
          done