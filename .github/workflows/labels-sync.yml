name: Sync Labels

on:
  push:
    paths:
      - '.github/labels.yaml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync labels from .github/labels.yaml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          yaml=$(cat .github/labels.yaml)
          # Parse YAML with yq (installed on runners)
          echo "$yaml" | yq -r '.[] | @base64' | while IFS= read -r row; do
            _jq() { echo "$row" | base64 -d | yq -r "$1"; }
            name=$(_jq '.name')
            color=$(_jq '.color')
            desc=$(_jq '.description // ""')
            # Skip if label already exists
            if gh api repos/$GH_REPO/labels --jq '.[].name' | grep -Fxq "$name"; then
              echo "Label '$name' exists, skipping"
              continue
            fi
            echo "Creating label '$name' (#$color)"
            gh api --method POST repos/$GH_REPO/labels \
              -f name="$name" \
              -f color="$color" \
              -f description="$desc"
          done