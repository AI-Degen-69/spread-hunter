name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    # Windows-only gate: the bot runs on Windows, so the suite runs where
    # the bugs live. Six duration-balanced shards keep the gate at roughly
    # 3-4 minutes. scripts/ci/pytest_shard.py globs tests/ at runtime, so
    # new test files are always assigned somewhere.
    name: pytest (windows shard ${{ matrix.shard }}/6)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # tests/conftest.py scrubs credentials and blocks non-loopback sockets,
      # so the suite needs no secrets and makes no outbound calls.
      # `shell: bash` keeps word-splitting identical on both OSes.
      - name: Run tests
        shell: bash
        run: python -m pytest -q $(python scripts/ci/pytest_shard.py --shard "${{ matrix.shard }}" --of 6)
