# Rules for .github/workflows/labeler.yml (github/issue-labeler).
#
# The key is the label as it appears in this tracker. The action **fails the
# job** for a name that does not exist -- it cannot create one -- so every key
# here is an existing label (`gh label list`). A name with a colon or an emoji
# would need quoting; none of these do.
#
# The value is read as `/<pattern>/i`: the action hands a bare string to
# String.match, which is case-sensitive, and only the `/.../flags` form turns
# that off. Several entries under one key are ANDed, not ORed (the action
# requires every regex in the list to match), so each label gets one pattern.
#
# Patterns stay on words a reporter actually uses. A rule that fires on
# "error" would label most bug reports ever written, and a wrong label costs
# more triage than a missing one -- the maintainer still triages by hand.
#
# Severity is the maintainer's call, not a keyword's, so nothing here applies
# "🚨 Critical". A reporter writing "this is urgent" usually means "this annoys
# me", and a P0 label applied by regex is one the reader learns to ignore.

# --- Status / Workflow ---
"🤖 Ready for Agent":
  - '/\b(ready[- ]for[- ]agent|afk|agent[- ]ready)\b/i'

"👤 Ready for Human":
  - '/\b(ready[- ]for[- ]human|human[- ]required|manual)\b/i'

"🔍 Needs Triage":
  - '/\b(needs[- ]triage|triage)\b/i'

"🙋 Needs Input":
  - '/\b(needs[- ]info|needs[- ]answers?|open question|more info|information needed|how do i|how can i|why does|why is|is there a way)\b/i'

"🚧 Blocked":
  - '/\b(blocked|blocked:code[- ]gate|code gate|code[- ]gate|waiting on|depends on)\b/i'

"💡 Idea":
  - '/\b(^idea:|raw idea|captured idea)\b/i'

"🔄 Duplicate":
  - '/\b(duplicate|dupe|already exists)\b/i'

"🚫 Won't Fix":
  - '/\b(wontfix|won.?t fix|will not fix)\b/i'

"❌ Invalid":
  - '/\b(invalid|not a bug|not an issue)\b/i'

"👍 Good First Issue":
  - '/\b(good first issue|good-first-issue|starter)\b/i'

"🙋 Help Wanted":
  - '/\b(help wanted|help-wanted|contributors? needed)\b/i'

# --- Types & Severities ---
"🐛 Bug":
  - '/\b(bug|error|exception|crash|panic|traceback|fail(ed|ing|ure)?|broken|unexpected)\b/i'

"✨ Feature":
  - '/\b(feat|feature|enhancement|request|add support|proposal|rfc)\b/i'

"📚 Documentation":
  - '/\b(doc|docs|documentation|readme|guide|wiki|typo)\b/i'

"⚡ Performance":
  - '/\b(perf|performance|latency|lag|slow|bottleneck|throughput|memory leak|cpu spike)\b/i'

"🚨 Critical":
  - '/\b(urgent|critical|sev-?1|p0|outage|downtime|hotfix|liquidat(ed|ion))\b/i'

"⚡ Quick Fix":
  - '/\b(quick[- ]?fix|typo|one[- ]?liner|trivial)\b/i'

"🛠️ Maintenance":
  - '/\b(maintenance|refactor|dependency|dependencies|ci|cd|github actions|workflow|build|deploy|docker|compose|k8s|kubernetes|tooling|infra|upgrade)\b/i'

# --- Quality ---
"♿ Accessibility":
  - '/\b(accessibility|a11y|screen reader|wcag|aria|keyboard navigation)\b/i'

"🔒 Security":
  - '/\b(security|vulnerability|vuln|cve|hardening|auth|authorization|authentication|xss|csrf|injection)\b/i'

"🧪 Testing":
  - '/\b(test|testing|coverage|flaky|e2e|integration test|unit test|snapshot)\b/i'

"🎨 UI & Design":
  - '/\b(ui|ux|frontend|design|css|style|layout|component|dashboard|visual)\b/i'