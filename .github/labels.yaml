# The labels this tracker carries, as the source of truth for
# .github/workflows/labels-sync.yaml (additive: nothing here deletes one).
# Mirrors `gh label list` at the time it was written; a name with a colon or
# an emoji is quoted so YAML keeps it a string.
#
# GENERIC LABELS — suitable for any repository, any project type.

# --- Status / Workflow ---
- name: "🤖 Ready for Agent"
  color: "0e8a16"
  description: "Fully specified, ready for an AFK agent"

- name: "👤 Ready for Human"
  color: "fbca04"
  description: "Requires human implementation"

- name: "🔍 Needs Triage"
  color: "e99695"
  description: "Maintainer needs to evaluate this idea"

- name: "🙋 Needs Input"
  color: "d876e3"
  description: "Waiting on reporter for more information, open questions, or clarification"

- name: "🚧 Blocked"
  color: "B60205"
  description: "Blocked by another issue, external dependency, or gate"

- name: "💡 Idea"
  color: "bfd4f2"
  description: "Raw captured idea, not yet a task"

- name: "🔄 Duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"

- name: "🚫 Won't Fix"
  color: "ffffff"
  description: "This will not be worked on"

- name: "❌ Invalid"
  color: "e4e669"
  description: "This doesn't seem right"

- name: "👍 Good First Issue"
  color: "7057ff"
  description: "Good for newcomers"

- name: "🙋 Help Wanted"
  color: "008672"
  description: "Extra attention is needed"

# --- Types & Severities ---
- name: "🐛 Bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "✨ Feature"
  color: "a2eeef"
  description: "New feature or enhancement"

- name: "📚 Documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"

- name: "⚡ Performance"
  color: "ffb703"
  description: "Performance improvements or latency fixes"

- name: "🚨 Critical"
  color: "b60205"
  description: "Urgent/P0 issue requiring immediate fix"

- name: "⚡ Quick Fix"
  color: "2133fa"
  description: "Trivial correction (typo, stale comment, wrong constant, ≤2 files, no behavior change)"

- name: "🛠️ Maintenance"
  color: "6f42c1"
  description: "Refactoring, dependency updates, tooling, CI/CD, or infrastructure"

# --- Quality ---
- name: "♿ Accessibility"
  color: "f143ab"
  description: "Barrier affecting people with disabilities"

- name: "🔒 Security"
  color: "ff0000"
  description: "Security vulnerability or hardening"

- name: "🧪 Testing"
  color: "006b75"
  description: "Test coverage, test infrastructure, or flaky tests"

- name: "🎨 UI & Design"
  color: "f06292"
  description: "Frontend, UI/UX, design system, or visual changes"