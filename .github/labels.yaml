# The labels this tracker carries, as the source of truth for
# .github/workflows/labels-sync.yaml (additive: nothing here deletes one).
# Mirrors `gh label list` at the time it was written; a name with a colon or
# an emoji is quoted so YAML keeps it a string.

- name: "accessibility"
  color: "f143ab"
  description: "Barrier affecting people with disabilities"

- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"

- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"

- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"

- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"

- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"

- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"

- name: "question"
  color: "d876e3"
  description: "Further information is requested"

- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"

- name: "needs-triage"
  color: "e99695"
  description: "Maintainer needs to evaluate this idea"

- name: "needs-info"
  color: "d876e3"
  description: "Waiting on reporter for more information"

- name: "ready-for-agent"
  color: "0e8a16"
  description: "Fully specified, ready for an AFK agent"

- name: "idea"
  color: "bfd4f2"
  description: "Raw captured idea, not yet a task"

- name: "ready-for-human"
  color: "fbca04"
  description: "Requires human implementation"

- name: "needs-answers"
  color: "FBCA04"

- name: "family:execution-telemetry"
  color: "1d76db"
  description: "Execution telemetry suite: fill-path, friction, queue, markout, capital risk"

- name: "⚡quick-fix"
  color: "2133fa"

- name: "blocked:code-gate"
  color: "B60205"
  description: "Blocked until all code tasks are done — needs stable codebase before running"
